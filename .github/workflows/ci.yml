name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: go mod tidy is clean
        run: make tidy

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.5.0

      - name: Test
        run: make test

      - name: Build
        run: make build
